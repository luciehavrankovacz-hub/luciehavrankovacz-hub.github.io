<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hledám stránku…</title>
<script>
// Oprava překlepů v adrese: velká písmena a háčky/čárky → malá písmena bez diakritiky
// (např. /Strunatci/ → /strunatci/). Když se adresa nezmění, ukáže se rozcestník.
(function () {
  var p = location.pathname;
  var opraveno = p.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, '-');
  if (opraveno !== p) { location.replace(opraveno + location.search + location.hash); }
})();
</script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#04182a;color:#eaf6ff;font-family:'Segoe UI',Arial,sans-serif;text-align:center;padding:16px;box-sizing:border-box}
  a{display:inline-block;margin-top:14px;background:#f6c446;color:#101e3a;font-weight:800;text-decoration:none;padding:12px 22px;border-radius:12px;font-size:20px}
  h1{font-size:40px;margin:0 0 8px}
</style>
</head>
<body>
  <div>
    <h1>🔎 Tahle stránka tu není</h1>
    <p>Možná je v adrese překlep. Všechna naše videa a hry najdeš tady:</p>
    <a href="/videa/">🎬 Rozcestník s videi</a>
  </div>
</body>
</html>
